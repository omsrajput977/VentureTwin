<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1020; }
      .card { fill: #111827; stroke: #1e293b; stroke-width: 1.5; rx: 10px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 800; fill: #ffffff; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
      .col-header { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
      .agent-title { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
      .mono-val { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; }
      .arrow { stroke: #475569; stroke-width: 1.5; fill: none; marker-end: url(#arrowGray); }
      .arrow-teal { stroke: #2dd4bf; stroke-width: 1.8; fill: none; marker-end: url(#arrowTeal); }
    </style>
    <marker id="arrowGray" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#475569" />
    </marker>
    <marker id="arrowTeal" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#2dd4bf" />
    </marker>
  </defs>

  <!-- Canvas Frame -->
  <rect width="960" height="480" rx="14" class="bg" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="36" y="38" class="title">Empirical Conflict Resolution (Simulation vs Voting)</text>
  <text x="36" y="58" class="subtitle">How VentureTwin settles multi-agent parameter disagreements deterministically without LLM hallucination</text>

  <!-- Step 1: Disagreement Intake -->
  <g transform="translate(36, 85)">
    <rect width="250" height="340" class="card"/>
    <text x="20" y="30" class="col-header" fill="#f87171">1. CONFLICT DETECTED</text>
    <text x="20" y="48" font-family="system-ui" font-size="11" fill="#94a3b8">Opposing bounds on same variable</text>

    <!-- CFO Card -->
    <g transform="translate(16, 68)">
      <rect width="218" height="110" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="14" y="24" class="agent-title" fill="#38bdf8">CFO Proposal</text>
      <text x="14" y="42" class="mono-val" fill="#cbd5e1">free_to_paid_conversion</text>
      <rect x="14" y="52" width="190" height="26" rx="4" fill="#0f172a"/>
      <text x="22" y="69" class="mono-val" fill="#7dd3fc">[0.001 - 0.010 - 0.050]</text>
      <text x="14" y="96" font-family="system-ui" font-size="10" fill="#94a3b8">Conservative cash defence</text>
    </g>

    <!-- Growth Card -->
    <g transform="translate(16, 196)">
      <rect width="218" height="110" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
      <text x="14" y="24" class="agent-title" fill="#34d399">Growth Proposal</text>
      <text x="14" y="42" class="mono-val" fill="#cbd5e1">free_to_paid_conversion</text>
      <rect x="14" y="52" width="190" height="26" rx="4" fill="#0f172a"/>
      <text x="22" y="69" class="mono-val" fill="#6ee7b7">[0.001 - 0.048 - 0.100]</text>
      <text x="14" y="96" font-family="system-ui" font-size="10" fill="#94a3b8">Optimistic conversion velocity</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="286" y1="255" x2="336" y2="255" class="arrow"/>

  <!-- Step 2: Deterministic Isolation -->
  <g transform="translate(336, 85)">
    <rect width="310" height="340" class="card" stroke="#8b5cf6"/>
    <text x="20" y="30" class="col-header" fill="#a78bfa">2. EMPIRICAL ISOLATION (NO VOTING)</text>
    <text x="20" y="48" font-family="system-ui" font-size="11" fill="#94a3b8">simulation/engine.py runs dual 24-mo runs</text>

    <g transform="translate(16, 68)">
      <rect width="278" height="110" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="14" y="22" font-family="system-ui" font-size="12" font-weight="700" fill="#ffffff">Run 1: At CFO Bound (1.0%)</text>
      <text x="14" y="42" class="mono-val" fill="#94a3b8">Strategy A Net: $153,581 (3.1mo)</text>
      <text x="14" y="60" class="mono-val" fill="#2dd4bf">Strategy B Net: $206,548 (3.9mo)</text>
      <text x="14" y="82" font-family="system-ui" font-size="11" font-weight="600" fill="#fbbf24">Winner: Strategy B (+34.5% margin)</text>
    </g>

    <g transform="translate(16, 196)">
      <rect width="278" height="110" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="14" y="22" font-family="system-ui" font-size="12" font-weight="700" fill="#ffffff">Run 2: At Growth Bound (4.8%)</text>
      <text x="14" y="42" class="mono-val" fill="#94a3b8">Strategy A Net: $1,004,124 (&gt;12mo)</text>
      <text x="14" y="60" class="mono-val" fill="#2dd4bf">Strategy B Net: $1,141,045 (&gt;12mo)</text>
      <text x="14" y="82" font-family="system-ui" font-size="11" font-weight="600" fill="#2dd4bf">Winner: Strategy B (+13.6% margin)</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="646" y1="255" x2="696" y2="255" class="arrow-teal"/>

  <!-- Step 3: Resolution Verdict -->
  <g transform="translate(696, 85)">
    <rect width="228" height="340" class="card" stroke="#2dd4bf"/>
    <text x="18" y="30" class="col-header" fill="#2dd4bf">3. VERIFIED VERDICT</text>
    <text x="18" y="48" font-family="system-ui" font-size="11" fill="#94a3b8">conflict/resolver.py</text>

    <g transform="translate(14, 68)">
      <rect width="200" height="88" rx="6" fill="#134e4a" fill-opacity="0.3" stroke="#2dd4bf"/>
      <text x="14" y="24" font-family="system-ui" font-size="11" font-weight="700" fill="#5eead4">DECISION INVARIANT</text>
      <text x="14" y="44" font-family="system-ui" font-size="10.5" fill="#cbd5e1">Strategy B strictly dominates Strategy A across both bounds.</text>
      <text x="14" y="74" class="mono-val" font-size="9" fill="#2dd4bf">Status: decided_by_sim</text>
    </g>

    <g transform="translate(14, 170)">
      <rect width="200" height="136" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="14" y="24" font-family="system-ui" font-size="11" font-weight="700" fill="#ffffff">Provenance Audit</text>
      <text x="14" y="42" font-family="system-ui" font-size="10" fill="#94a3b8">Disagreement logged in report Section 4 with flip-point sensitivity. Zero LLM averaging.</text>
      <line x1="14" y1="62" x2="186" y2="62" stroke="#334155" stroke-width="1"/>
      <text x="14" y="80" class="mono-val" font-size="9" fill="#a78bfa">Flip point: None</text>
      <text x="14" y="96" class="mono-val" font-size="9" fill="#94a3b8">B dominates for all</text>
      <text x="14" y="112" class="mono-val" font-size="9" fill="#94a3b8">conv in [0.005, 0.15]</text>
    </g>
  </g>

  <!-- Bottom Banner Note -->
  <rect x="36" y="440" width="888" height="26" rx="6" fill="#1e293b"/>
  <text x="48" y="457" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Rule: <tspan fill="#ffffff" font-weight="600">LLMs only propose bounded assumptions.</tspan> The simulation engine runs the math. If bounds flip the winner, it flags <tspan fill="#fbbf24" font-weight="600">UNRESOLVED</tspan> for human sign-off.</text>
</svg>
