<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1020; }
      .tagline { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #94a3b8; text-anchor: middle; }
      .link-hint { font-family: ui-monospace, monospace; font-size: 11px; fill: #2dd4bf; text-anchor: middle; }
    </style>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="25%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#134e4a"/>
      <stop offset="75%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="120" rx="12" class="bg" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="2" y="2" width="1196" height="116" rx="10" fill="url(#waveGrad)" fill-opacity="0.4"/>

  <!-- Flowing Network Curves -->
  <path d="M 0 60 Q 300 15 600 60 T 1200 60" fill="none" stroke="#2dd4bf" stroke-width="1.2" stroke-opacity="0.4"/>
  <path d="M 0 60 Q 300 105 600 60 T 1200 60" fill="none" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Network Nodes -->
  <circle cx="200" cy="42" r="3" fill="#2dd4bf"/>
  <circle cx="400" cy="78" r="3" fill="#8b5cf6"/>
  <circle cx="600" cy="60" r="4" fill="#38bdf8"/>
  <circle cx="800" cy="42" r="3" fill="#fbbf24"/>
  <circle cx="1000" cy="78" r="3" fill="#f87171"/>

  <text x="600" y="52" class="tagline">VentureTwin · SwarmFlow Multi-Agent Coordination Engine</text>
  <text x="600" y="76" class="link-hint">Deterministic SaaS Simulation · Zero Hallucinated Numbers · Resilient by Design</text>
</svg>
